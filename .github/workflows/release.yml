name: Release Pipeline

on:
  push:
    branches: [staging, main]

jobs:
  package-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    outputs:
      artifact-name: ${{ steps.meta.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build JAR
        run: mvn -B clean package -DskipTests

      - name: Set Artifact Name
        id: meta
        run: echo "name=backend-${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ github.sha }}
          path: backend/target/*.jar

  deploy-note:
    runs-on: ubuntu-latest
    needs: package-backend
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Release Summary
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}"
          echo "Artifact: backend-${{ github.sha }}"
          echo "Configure real deploy commands (Kubernetes, VM, or container registry) here."
